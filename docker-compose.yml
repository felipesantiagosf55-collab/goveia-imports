services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: goveia_imports
      DB_USER: goveia
      DB_PASSWORD: goveia_dev_password
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: goveia_imports
      MYSQL_USER: goveia
      MYSQL_PASSWORD: goveia_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
